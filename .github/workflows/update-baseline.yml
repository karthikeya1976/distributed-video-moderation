name: Update Test Baseline

# Runs after a merge to main: re-runs both test suites and commits the
# refreshed .ci/baseline-results.json so future PRs are compared against
# main's actual current state, not a stale snapshot.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    # Skip the loop this workflow's own commit would otherwise trigger
    if: "!contains(github.event.head_commit.message, '[skip baseline]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          mkdir -p results
          python -m pytest tests/ -v --junitxml=results/backend.xml || true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run --reporter=junit --outputFile=../results/frontend.xml || true

      - name: Regenerate baseline
        run: python scripts/generate_baseline.py --results results/ --out .ci/baseline-results.json

      - name: Commit updated baseline if changed
        run: |
          if git diff --quiet .ci/baseline-results.json; then
            echo "Baseline unchanged."
            exit 0
          fi
          git config user.name "editor-club-bot"
          git config user.email "noreply@anthropic.com"
          git add .ci/baseline-results.json
          git commit -m "chore: refresh test baseline [skip baseline]"
          git push
