name: PR Review Bot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel a stale run if new commits land on the same PR while this is running.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Job 1: lint + typecheck (frontend) + syntax check (backend) ──────────────
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (frontend)
        working-directory: frontend
        run: npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Syntax-check backend modules
        run: python -m py_compile backend/app/*.py backend/app/pillars/*.py

  # ── Job 2: build the frontend, verify the build artifacts are intact ─────────
  artifact-scan:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify build artifacts are intact
        run: python scripts/verify_artifacts.py --dir frontend/.next

  # ── Job 3: run both test suites, compare against the main-branch baseline ────
  regression-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: |
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          mkdir -p results
          python -m pytest tests/ -v --junitxml=results/backend.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run --reporter=junit --outputFile=../results/frontend.xml

      - name: Compare against baseline
        run: python scripts/compare_baseline.py --results results/ --baseline .ci/baseline-results.json

  # ── Job 4: decision — merge only if every job above reported success ─────────
  decision:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, artifact-scan, regression-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate gates and merge if green
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          python scripts/review_bot.py \
            --pr ${{ github.event.pull_request.number }} \
            --check lint-typecheck=${{ needs.lint-typecheck.result }} \
            --check artifact-scan=${{ needs.artifact-scan.result }} \
            --check regression-tests=${{ needs.regression-tests.result }}
