services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_moderation}
      POSTGRES_USER: ${POSTGRES_USER:-*****}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-*****}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
