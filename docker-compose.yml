services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: video_moderation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: redactor123
      # Trust all host connections so Windows→Docker works without auth headaches in dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
